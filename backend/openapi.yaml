openapi: 3.0.3
info:
  title: GreenLight API
  description: >
    Red comunitaria offline-first para reportar quemas y focos de humo.
    Los reportes pasan por: activo &rarr; confirmado_comunidad &rarr; verificado.
    Documentado con Swagger en /api/docs. Autenticación JWT (Bearer) firmada
    con SECRET_KEY; errores: 401 (token ausente/inválido/expirado), 403
    (sin permiso), 404 (recurso inexistente/invisible), 422 (validación),
    409 (conflicto).
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Desarrollo local
  - url: https://greenlight-api-a487.onrender.com
    description: Producción (Render)
tags:
  - name: Salud
    description: Estado del servicio
  - name: Auth
    description: Registro, inicio de sesión y perfil
  - name: Reportes
    description: Feed comunitario y reportes de quemas
  - name: Admin
    description: Comunidades y tipos de incidente (coordinador)
  - name: Sincronización
    description: Lote offline-first
security:
  - bearerAuth: []
paths:
  /api/salud:
    get:
      tags: [Salud]
      summary: Healthcheck para Render (SUPABASE_URL/SUPABASE_KEY)
      operationId: salud
      security: []
      responses:
        '200':
          description: Servicio y base de datos operativos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /api/health:
    get:
      tags: [Salud]
      summary: Healthcheck de compatibilidad
      operationId: health
      security: []
      responses:
        '200':
          description: Servicio y base de datos conectada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Salud'
  /api/auth/registro:
    post:
      tags: [Auth]
      summary: Crea una cuenta de usuario
      operationId: registrar
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroBody'
      responses:
        '201':
          description: Usuario creado (devuelve token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: El correo ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión y devuelve un access token JWT
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correo, contraseña]
              properties:
                correo:
                  type: string
                  example: maria@greenlight.test
                contraseña:
                  type: string
                  format: password
                  example: Vecino123!
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Credenciales incorrectas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Perfil del usuario autenticado
      operationId: perfil
      responses:
        '200':
          description: Datos del usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/usuarios:
    get:
      tags: [Auth]
      summary: Lista usuarios (solo coordinador)
      operationId: listarUsuarios
      responses:
        '200':
          description: Listado de usuarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Usuario'
        '403':
          description: No eres coordinador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Auth]
      summary: Crea un usuario (solo coordinador)
      operationId: crearUsuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroBody'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
  /api/auth/usuarios/{usuario_id}:
    put:
      tags: [Auth]
      summary: Actualiza nombre/rol/comunidad de un usuario (solo coordinador)
      operationId: actualizarUsuario
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                rol:
                  type: string
                  enum: [usuario, coordinador]
                comunidad_id:
                  type: string
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Auth]
      summary: Elimina un usuario (solo coordinador)
      operationId: eliminarUsuario
      parameters:
        - $ref: '#/components/parameters/UsuarioId'
      responses:
        '200':
          description: Usuario eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/feed:
    get:
      tags: [Reportes]
      summary: Feed público de reportes (con filtros opcionales)
      operationId: feed
      security: []
      parameters:
        - name: tipo_id
          in: query
          schema:
            type: integer
        - name: comunidad_id
          in: query
          schema:
            type: string
        - name: estado
          in: query
          schema:
            type: string
            enum: [activo, confirmado_comunidad, verificado]
      responses:
        '200':
          description: Listado de reportes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reporte'
  /api/reportes:
    post:
      tags: [Reportes]
      summary: Crea un reporte (el autor sale del token, nunca del body)
      operationId: crearReporte
      description: >
        El servidor ignora cualquier user_id enviado en el body: el autor
        siempre es el usuario autenticado (g.usuario.id).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReporteBody'
      responses:
        '201':
          description: Reporte creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '401':
          description: Token ausente, inválido o expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reportes/{reporte_id}:
    get:
      tags: [Reportes]
      summary: Detalle de un reporte (público)
      operationId: detalleReporte
      security: []
      parameters:
        - $ref: '#/components/parameters/ReporteId'
      responses:
        '200':
          description: Detalle del reporte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '404':
          description: Reporte no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Reportes]
      summary: Edita un reporte (autor o coordinador)
      operationId: actualizarReporte
      parameters:
        - $ref: '#/components/parameters/ReporteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                descripcion:
                  type: string
                ubicacion_texto:
                  type: string
                latitud:
                  type: number
                longitud:
                  type: number
                tipo_id:
                  type: integer
                comunidad_id:
                  type: string
      responses:
        '200':
          description: Reporte actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '403':
          description: No eres el autor ni el coordinador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reporte no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reportes]
      summary: Elimina un reporte (autor o coordinador)
      operationId: eliminarReporte
      parameters:
        - $ref: '#/components/parameters/ReporteId'
      responses:
        '200':
          description: Reporte eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        '403':
          description: No eres el autor ni el coordinador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reporte no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reportes/{reporte_id}/confirmar:
    post:
      tags: [Reportes]
      summary: Confirma un reporte de otro usuario (+1)
      operationId: confirmarReporte
      parameters:
        - $ref: '#/components/parameters/ReporteId'
      responses:
        '200':
          description: Confirmación registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '409':
          description: No puedes confirmar el propio o ya confirmaste
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reportes/{reporte_id}/estado:
    patch:
      tags: [Reportes]
      summary: Cambia el estado del reporte (solo coordinador)
      operationId: cambiarEstado
      parameters:
        - $ref: '#/components/parameters/ReporteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado:
                  type: string
                  enum: [activo, confirmado_comunidad, verificado]
      responses:
        '200':
          description: Estado actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reporte'
        '403':
          description: Solo el coordinador puede cambiar el estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/stats:
    get:
      tags: [Reportes]
      summary: Estadísticas globales de reportes
      operationId: stats
      security: []
      responses:
        '200':
          description: Estadísticas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stats'
  /api/comunidades:
    get:
      tags: [Admin]
      summary: Lista comunidades (público)
      operationId: listarComunidades
      security: []
      responses:
        '200':
          description: Listado de comunidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comunidad'
    post:
      tags: [Admin]
      summary: Crea una comunidad (solo coordinador)
      operationId: crearComunidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                zona_ciudad:
                  type: string
                latitud:
                  type: number
                longitud:
                  type: number
      responses:
        '201':
          description: Comunidad creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunidad'
  /api/comunidades/{comunidad_id}:
    put:
      tags: [Admin]
      summary: Actualiza una comunidad (solo coordinador)
      operationId: actualizarComunidad
      parameters:
        - $ref: '#/components/parameters/ComunidadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                zona_ciudad:
                  type: string
      responses:
        '200':
          description: Comunidad actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comunidad'
    delete:
      tags: [Admin]
      summary: Elimina una comunidad (solo coordinador)
      operationId: eliminarComunidad
      parameters:
        - $ref: '#/components/parameters/ComunidadId'
      responses:
        '200':
          description: Comunidad eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/tipo-incidentes:
    get:
      tags: [Admin]
      summary: Lista tipos de incidente (público)
      operationId: listarTipos
      security: []
      responses:
        '200':
          description: Listado de tipos de incidente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TipoIncidente'
    post:
      tags: [Admin]
      summary: Crea un tipo de incidente (solo coordinador)
      operationId: crearTipo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre]
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                icono:
                  type: string
                color_etiqueta:
                  type: string
      responses:
        '201':
          description: Tipo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoIncidente'
  /api/tipo-incidentes/{tipo_id}:
    put:
      tags: [Admin]
      summary: Actualiza un tipo de incidente (solo coordinador)
      operationId: actualizarTipo
      parameters:
        - $ref: '#/components/parameters/TipoId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nombre:
                  type: string
                descripcion:
                  type: string
                icono:
                  type: string
                color_etiqueta:
                  type: string
      responses:
        '200':
          description: Tipo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoIncidente'
    delete:
      tags: [Admin]
      summary: Elimina un tipo de incidente (solo coordinador)
      operationId: eliminarTipo
      parameters:
        - $ref: '#/components/parameters/TipoId'
      responses:
        '200':
          description: Tipo eliminado
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /api/sync:
    post:
      tags: [Sincronización]
      summary: Recibe el lote de reportes/confirmaciones creados offline
      operationId: sincronizar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reportes:
                  type: array
                  items:
                    $ref: '#/components/schemas/ReporteBody'
                confirmaciones:
                  type: array
                  items:
                    type: object
                    properties:
                      reporte_id:
                        type: string
      responses:
        '201':
          description: Lote procesado
          content:
            application/json:
              schema:
                type: object
                properties:
                  reportes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporte'
                  confirmaciones:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reporte'
        '422':
          description: No hay datos para sincronizar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UsuarioId:
      name: usuario_id
      in: path
      required: true
      schema:
        type: string
    ReporteId:
      name: reporte_id
      in: path
      required: true
      schema:
        type: string
    ComunidadId:
      name: comunidad_id
      in: path
      required: true
      schema:
        type: string
    TipoId:
      name: tipo_id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Salud:
      type: object
      properties:
        status:
          type: string
          example: ok
        database:
          type: string
          example: connected
        project:
          type: string
          example: GreenLight
    Error:
      type: object
      properties:
        error:
          type: string
          example: Descripción del error
    Usuario:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          enum: [usuario, coordinador]
        comunidad_id:
          type: string
          nullable: true
        comunidad:
          type: string
          nullable: true
        fecha_creacion:
          type: string
          format: date-time
          nullable: true
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        usuario:
          $ref: '#/components/schemas/Usuario'
    RegistroBody:
      type: object
      required: [nombre, correo, contraseña]
      properties:
        nombre:
          type: string
          minLength: 2
        correo:
          type: string
          format: email
        contraseña:
          type: string
          format: password
          minLength: 6
        rol:
          type: string
          enum: [usuario, coordinador]
          default: usuario
        comunidad_id:
          type: string
          nullable: true
    Reporte:
      type: object
      properties:
        id:
          type: string
        slug_url:
          type: string
        comunidad_id:
          type: string
          nullable: true
        comunidad:
          type: string
          nullable: true
        usuario_id:
          type: string
        autor:
          type: string
        tipo_id:
          type: integer
        tipo:
          type: string
        icono:
          type: string
          nullable: true
        color_etiqueta:
          type: string
          nullable: true
        ubicacion_texto:
          type: string
          nullable: true
        latitud:
          type: number
          nullable: true
        longitud:
          type: number
          nullable: true
        descripcion:
          type: string
        foto_url:
          type: string
          nullable: true
        estado:
          type: string
          enum: [activo, confirmado_comunidad, verificado]
        confirmaciones:
          type: integer
        fecha_creacion:
          type: string
          format: date-time
          nullable: true
    ReporteBody:
      type: object
      required: [tipo_id, descripcion]
      properties:
        tipo_id:
          type: integer
        descripcion:
          type: string
          minLength: 5
        comunidad_id:
          type: string
          nullable: true
        ubicacion_texto:
          type: string
          nullable: true
        latitud:
          type: number
          nullable: true
        longitud:
          type: number
          nullable: true
        foto_url:
          type: string
          nullable: true
    Comunidad:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        zona_ciudad:
          type: string
          nullable: true
        latitud:
          type: number
          nullable: true
        longitud:
          type: number
          nullable: true
        limites_geojson:
          nullable: true
        fecha_creacion:
          type: string
          format: date-time
          nullable: true
    TipoIncidente:
      type: object
      properties:
        id:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        icono:
          type: string
          nullable: true
        color_etiqueta:
          type: string
          nullable: true
    Stats:
      type: object
      properties:
        total_reportes:
          type: integer
        total_confirmaciones:
          type: integer
        total_usuarios:
          type: integer
        total_comunidades:
          type: integer
        por_estado:
          type: object
        por_tipo:
          type: object
# Blueprint de Render para GreenLight
# Servicios web Flask (gunicorn) + frontend estático.
# En Render: New > Blueprint > seleccionar el repositorio > Apply.
# Para usar Supabase: configura DATABASE_URL (Session pooler), SUPABASE_URL y
# SUPABASE_KEY en cada servicio. Healthcheck: /api/salud.
#
# La consigna pide el despliegue en Render o Cloudflare. Este blueprint deja
# listo el camino de Render:
#   greenlight-api  -> API Flask (ya desplegada y verificada)
#   greenlight-web  -> frontend React como static site en Render
#   taskflow-api    -> API complementaria del plan de pruebas Postman
#   (mini-task-manager-api sigue comentado: es laboratorio de clase, no el MVP)
#
# El frontend también está publicado en GitHub Pages (deploy-pages.yml) como
# segunda entrega; por eso CORS_ORIGINS del API incluye los dos orígenes.
# Si publicas solo en uno, deja solo ese origen en CORS_ORIGINS.

services:
  # ---------------------------------------------------------------------------
  # API principal: GreenLight (reporte de quemas)
  # ---------------------------------------------------------------------------
  - type: web
    name: greenlight-api
    runtime: python
    plan: free
    rootDir: backend
    healthCheckPath: /api/salud
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_VERSION
        value: "3.1.0"
      - key: JWT_EXPIRATION_MINUTES
        value: "120"
      - key: CONFIRMATION_THRESHOLD
        value: "3"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Orígenes permitidos: el static site de Render y GitHub Pages.
      - key: CORS_ORIGINS
        value: "https://greenlight-web.onrender.com,https://proweb26.github.io"

  # ---------------------------------------------------------------------------
  # Frontend GreenLight (React) como static site en Render.
  # Es la opción que cumple literalmente "producción en Render". Alternativa
  # equivalente en Cloudflare Pages documentada en docs/DEPLOY_RENDER.md §3.
  # ---------------------------------------------------------------------------
  - type: static_site
    name: greenlight-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://greenlight-api-a487.onrender.com/api

  # ---------------------------------------------------------------------------
  # API complementaria: TaskFlow (Plan de Pruebas Postman)
  # ---------------------------------------------------------------------------
  - type: web
    name: taskflow-api
    runtime: python
    plan: free
    rootDir: taskflow
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:app" --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: DATABASE_URL
        sync: false

  # ---------------------------------------------------------------------------
  # API simulada: Mini Task Manager (Node.js / Express). Laboratorio de clase.
  # ---------------------------------------------------------------------------
  # - type: web
  #   name: mini-task-manager-api
